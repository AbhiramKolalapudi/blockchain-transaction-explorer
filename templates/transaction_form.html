{% extends 'base.html' %}{% block title %}Add transaction{% endblock %}{% block content %}
<div class="page-heading"><div><div class="eyebrow">NEW TRANSACTION</div><h1>Add a transaction</h1><p>Record a transaction on the network.</p></div><a class="button button-quiet" href="{{ url_for('transactions') }}">← Back to transactions</a></div>
<div class="flash success transaction-guidance">Transaction amounts must be greater than zero. Gas fees must be zero or higher.</div>
<form class="panel mongo-form" method="post"><div class="form-grid"><label>Transaction hash<input name="tx_hash" required maxlength="66" value="{{ form.get('tx_hash','') }}" placeholder="Enter transaction hash"></label><label>Status<select name="status" required><option value="">Choose status</option>{% for value in ['Success','Failed','Pending'] %}<option value="{{ value }}" {% if form.get('status')==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label><label>Amount (ETH)<input name="amount" type="number" step="any" required value="{{ form.get('amount','') }}" placeholder="0.125"></label><label>Gas fee (ETH)<input name="gas_fee" type="number" step="any" required value="{{ form.get('gas_fee','0.001') }}" placeholder="0.001"></label><label>Block<select name="block_number" required><option value="">Choose block</option>{% for block in blocks %}<option value="{{ block.block_number }}" {% if form.get('block_number')==block.block_number|string %}selected{% endif %}>#{{ block.block_number }}</option>{% endfor %}</select></label><label>Timestamp (UTC)<input type="datetime-local" name="timestamp" required value="{{ form.get('timestamp', '') or now_utc }}"></label><label>From address<select name="from_address" required><option value="">Choose sender</option>{% for item in addresses %}<option value="{{ item.address }}" {% if form.get('from_address')==item.address %}selected{% endif %}>{{ item.address }}</option>{% endfor %}</select></label><label>To address<select name="to_address" required><option value="">Choose receiver</option>{% for item in addresses %}<option value="{{ item.address }}" {% if form.get('to_address')==item.address %}selected{% endif %}>{{ item.address }}</option>{% endfor %}</select></label></div><div class="form-actions"><a class="button button-quiet" href="{{ url_for('transactions') }}">Cancel</a><button class="button">Add transaction</button></div></form>{% endblock %}
